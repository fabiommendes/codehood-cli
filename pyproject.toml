[project]
name = "codehood-cli"
version = "0.1.0"
description = "Command line client for Codehood, an LMS for geeky types."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fábio Macêdo Mendes", email = "fabiomacedomendes@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mdq",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/fabiommendes/codehood"
Source = "https://github.com/fabiommendes/codehood/tree/main/cli"
Issues = "https://github.com/fabiommendes/codehood/issues"
Changelog = "https://github.com/fabiommendes/codehood/blob/main/cli/CHANGELOG.md"

[project.scripts]
codehood = "codehood.cli:main"
ch = "codehood.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codehood"
module-root = ""

[dependency-groups]
dev = [
    "doc-zero>=0.2.1",
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "taskipy>=1.14.1",
    "types-pyyaml>=6.0.12",
]

[tool.taskipy.tasks]
api-codegen = "python -m codehood_cli.api.generate"
test-integration = "pytest --run-integration -m integration"

[tool.pytest.ini_options]
markers = [
    "integration: needs a running Codehood server (see CODEHOOD_SERVER); skipped by default, use --run-integration",
]

[tool.uv.sources]
mdq = { path = "../../mdq/mdq-py", editable = true }
